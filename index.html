<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자주 틀리는 맞춤법 퀴즈</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --line: #e3e7ef;
    --accent: #3a6df0;
    --accent-soft: #e8efff;
    --correct: #1f9d57;
    --correct-soft: #e4f6ec;
    --wrong: #d64545;
    --wrong-soft: #fdeaea;
    --shadow: 0 10px 30px rgba(31, 36, 48, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c;
      --card: #1b1f29;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --line: #2a2f3b;
      --accent: #5b8cff;
      --accent-soft: #223056;
      --correct: #43c478;
      --correct-soft: #163a28;
      --wrong: #ff6b6b;
      --wrong-soft: #3d1f22;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 8px 0 4px;
    letter-spacing: -0.02em;
  }
  .sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 22px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
  }

  /* 시작 화면 */
  .field { margin-bottom: 22px; }
  .field > label { display: block; font-weight: 700; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: 0.15s;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 700;
  }
  .btn {
    width: 100%;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 15px;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
  }

  /* 진행 바 */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .topbar .count { font-size: 0.9rem; color: var(--muted); }
  .topbar .score { font-size: 0.9rem; font-weight: 700; }
  .progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }

  .qnum { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
  .prompt { font-size: 1.3rem; font-weight: 700; margin-bottom: 22px; letter-spacing: -0.01em; }
  .blank {
    display: inline-block;
    min-width: 54px;
    border-bottom: 3px solid var(--accent);
    margin: 0 2px;
    vertical-align: bottom;
  }

  .options { display: grid; gap: 12px; }
  .opt {
    text-align: left;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 14px;
    padding: 15px 18px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.12s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt .mark { margin-left: auto; font-weight: 700; font-size: 0.9rem; }
  .opt.correct { border-color: var(--correct); background: var(--correct-soft); color: var(--correct); }
  .opt.wrong { border-color: var(--wrong); background: var(--wrong-soft); color: var(--wrong); }
  .opt:disabled { cursor: default; }

  .feedback { margin-top: 20px; }
  .verdict { font-weight: 700; margin-bottom: 6px; }
  .verdict.ok { color: var(--correct); }
  .verdict.no { color: var(--wrong); }
  .note {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.95rem;
    color: var(--text);
  }
  .next { margin-top: 18px; }

  /* 결과 화면 */
  .result-score { text-align: center; margin-bottom: 8px; }
  .result-score .big { font-size: 3rem; font-weight: 800; letter-spacing: -0.03em; }
  .result-score .pct { color: var(--muted); }
  .review-title { font-weight: 700; margin: 26px 0 12px; }
  .review-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .review-item .rq { font-weight: 700; margin-bottom: 8px; }
  .review-item .ra { font-size: 0.92rem; }
  .review-item .mine { color: var(--wrong); }
  .review-item .ans { color: var(--correct); }
  .review-item .rnote { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
  .allright { text-align: center; color: var(--correct); font-weight: 700; margin: 26px 0; }
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn-row .btn { flex: 1; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>자주 틀리는 맞춤법 퀴즈</h1>
  <p class="sub">운정고 1학년 국어 &lt;자주 틀리는 맞춤법&gt; 150문항으로 만든 연습 퀴즈</p>

  <!-- 시작 화면 -->
  <section id="start" class="card">
    <div class="field">
      <label>몇 문제 풀까?</label>
      <div class="chips" id="countChips">
        <button class="chip" data-count="10">10문제</button>
        <button class="chip" data-count="20">20문제</button>
        <button class="chip" data-count="50">50문제</button>
        <button class="chip on" data-count="all">전체</button>
      </div>
    </div>
    <div class="field">
      <label>순서는?</label>
      <div class="chips" id="orderChips">
        <button class="chip on" data-order="random">랜덤</button>
        <button class="chip" data-order="inorder">번호순</button>
      </div>
    </div>
    <button class="btn" id="startBtn">시작하기</button>
  </section>

  <!-- 퀴즈 화면 -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <span class="count" id="counter"></span>
      <span class="score" id="runningScore"></span>
    </div>
    <div class="progress"><span id="progressBar"></span></div>

    <div class="card">
      <div class="qnum" id="qnum"></div>
      <div class="prompt" id="prompt"></div>
      <div class="options" id="options"></div>
      <div class="feedback hidden" id="feedback">
        <div class="verdict" id="verdict"></div>
        <div class="note hidden" id="note"></div>
      </div>
      <div class="next hidden" id="nextWrap">
        <button class="btn" id="nextBtn">다음</button>
      </div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="hidden">
    <div class="card">
      <div class="result-score">
        <div class="big" id="finalScore"></div>
        <div class="pct" id="finalPct"></div>
      </div>
      <div id="reviewArea"></div>
      <div class="btn-row">
        <button class="btn ghost" id="againBtn">다시 풀기</button>
        <button class="btn" id="homeBtn">처음으로</button>
      </div>
    </div>
  </section>
</div>

<script>
// 문제 목록. 한 줄에 한 문제. p는 문장(____ 자리가 빈칸), o는 보기, a는 정답(여러 개면 다 맞음), note는 설명.
const QUESTIONS = [
  {n:"1", p:"병이 얼른 ____ 좋겠다.", o:["낳으면","나으면"], a:["나으면"], note:"'낫다(병이 낫다)'라서 '나으면'. '낳다'는 아이를 낳다."},
  {n:"2", p:"이 옷이 더 ____하지?", o:["문안","무난"], a:["무난"], note:""},
  {n:"3", p:"오늘은 ____ 숙제 다 할 거야.", o:["반드시","반듯이"], a:["반드시"], note:"'반드시'는 꼭. '반듯이'는 비뚤지 않고 바르게."},
  {n:"4", p:"왜 난리 ____인지 모르겠네.", o:["법석","법썩"], a:["법석"], note:""},
  {n:"5", p:"머리를 ____ 잘랐어.", o:["싹둑","싹뚝"], a:["싹둑"], note:""},
  {n:"6", p:"____ 기억이 났어.", o:["언듯","언뜻"], a:["언뜻"], note:""},
  {n:"7", p:"____ 비빔밥", o:["짭잘한","짭짤한"], a:["짭짤한"], note:""},
  {n:"8", p:"김치를 ____.", o:["담갔다","담궜다"], a:["담갔다"], note:"기본형이 '담그다'라서 '담가/담갔다'."},
  {n:"9", p:"바른 표기를 고르세요.", o:["깍뚝이","깍둑이","깍두기","깍뚜기"], a:["깍두기"], note:""},
  {n:"10", p:"물을 넣고 ____ 주세요.", o:["졸여","조려"], a:["졸여"], note:"국물을 줄이는 건 '졸이다'. 양념이 배게 하는 건 '조리다'(생선조림)."},
  {n:"11", p:"직접 ____ 대추차", o:["달인","다린"], a:["달인"], note:"차·약은 '달이다'. 옷은 '다리다'."},
  {n:"12", p:"바른 표기를 고르세요.", o:["오뚝이","오뚜기"], a:["오뚝이"], note:""},
  {n:"13", p:"바른 표기를 고르세요.", o:["몇일","몇 일","며칠"], a:["며칠"], note:""},
  {n:"14", p:"내가 가도 ____?", o:["돼","되"], a:["돼"], note:"'되어'로 바꿔 말이 되면 '돼'."},
  {n:"15", p:"하면 ____.", o:["돼요","되요"], a:["돼요"], note:""},
  {n:"16", p:"내일 또 ____.", o:["봬요","뵈요"], a:["봬요"], note:"'뵈어요'의 준말이라 '봬요'."},
  {n:"17", p:"일이 잘 ____ 바란다.", o:["되길","돼길"], a:["되길"], note:"'되기를'이라 '되길'."},
  {n:"18", p:"바른 표기를 고르세요.", o:["성공율","성공률"], a:["성공률"], note:"받침 있는 말 뒤(ㄴ 제외)는 '-률'."},
  {n:"19", p:"바른 표기를 고르세요.", o:["백분율","백분률"], a:["백분율"], note:"받침이 'ㄴ'이거나 모음 뒤면 '-율'."},
  {n:"20-1", p:"바른 표기를 고르세요.", o:["눈곱","눈꼽"], a:["눈곱"], note:""},
  {n:"20-2", p:"바른 표기를 고르세요.", o:["배곱","배꼽"], a:["배꼽"], note:""},
  {n:"21", p:"바른 표기를 고르세요.", o:["얽히고섥히다","얽히고설키다"], a:["얽히고설키다"], note:""},
  {n:"22", p:"바른 표기를 고르세요.", o:["짜장면","자장면"], a:["짜장면","자장면"], note:"둘 다 표준어야."},
  {n:"23", p:"바른 표기를 고르세요.", o:["늦장 대응","늑장 대응"], a:["늦장 대응","늑장 대응"], note:"'늦장'과 '늑장' 둘 다 표준어야."},
  {n:"24", p:"제 소개는 이 그림으로 ____하겠습니다.", o:["갈음","가름"], a:["갈음"], note:"대신하는 건 '갈음'. 나누는 건 '가름'."},
  {n:"25", p:"____ 한 시간 정도 걸려.", o:["겉잡아서","걷잡아서"], a:["겉잡아서"], note:"겉으로 어림잡는 건 '겉잡다'."},
  {n:"26", p:"바른 표기를 고르세요.", o:["해님","햇님"], a:["해님"], note:"'해'+'님'은 사이시옷 안 붙여."},
  {n:"27", p:"운동을 시작한 지 ____로 오 년.", o:["해수","햇수"], a:["햇수"], note:""},
  {n:"28-1", p:"바른 표기를 고르세요.", o:["전세방","전셋방"], a:["전세방"], note:"한자어끼리라 사이시옷 없음."},
  {n:"28-2", p:"바른 표기를 고르세요.", o:["전세집","전셋집"], a:["전셋집"], note:"'집'은 고유어라 사이시옷 붙음."},
  {n:"28-3", p:"바른 표기를 고르세요.", o:["세방","셋방"], a:["셋방"], note:"한자어지만 예외로 사이시옷 붙는 말."},
  {n:"29", p:"바른 표기를 고르세요.", o:["인사말","인삿말"], a:["인사말"], note:""},
  {n:"30", p:"바른 표기를 고르세요.", o:["존대말","존댓말"], a:["존댓말"], note:""},
  {n:"31", p:"바른 표기를 고르세요.", o:["뒤풀이","뒷풀이"], a:["뒤풀이"], note:""},
  {n:"32", p:"바른 표기를 고르세요.", o:["오렌지빛","오렌짓빛"], a:["오렌지빛"], note:""},
  {n:"33", p:"____ 고작 이거야?", o:["에개","애걔"], a:["애걔"], note:"사전에 오른 정식 표기는 '애걔'야. 학습지엔 '애개'로 돼 있었어."},
  {n:"34", p:"나무가 ____ 뻗어 있었다.", o:["멋드러지게","멋들어지게"], a:["멋들어지게"], note:""},
  {n:"35", p:"____ 들려온 소문에 의하면", o:["간간이","간간히"], a:["간간이"], note:""},
  {n:"36", p:"나도 ____ 생각해 봤어.", o:["곰곰이","곰곰히"], a:["곰곰이"], note:""},
  {n:"37", p:"____ 정리하고 가자.", o:["깨끗이","깨끗히"], a:["깨끗이"], note:""},
  {n:"38", p:"____ 공부하는 습관을 들이자.", o:["틈틈이","틈틈히"], a:["틈틈이"], note:""},
  {n:"39", p:"일을 ____ 않고 처리했다.", o:["서슴지","서슴치"], a:["서슴지"], note:"기본형이 '서슴다'."},
  {n:"40", p:"그건 앞뒤가 맞지 ____.", o:["안잖아","않잖아"], a:["않잖아"], note:"'아니하잖아'의 준말이라 '않-'."},
  {n:"41", p:"____ 운동장에서 뛰어놀았다.", o:["널찍한","넓직한"], a:["널찍한"], note:""},
  {n:"42", p:"바른 표기를 고르세요.", o:["일찍이","일찌기"], a:["일찍이"], note:""},
  {n:"43", p:"아파서 ____.", o:["어떻해","어떡해"], a:["어떡해"], note:"'어떻게 해'의 준말이라 '어떡해'."},
  {n:"44", p:"오늘은 ____.", o:["왠지","웬지"], a:["왠지"], note:"'왜인지'의 준말이라 '왠지'."},
  {n:"45", p:"바른 표기를 고르세요.", o:["웬일인지","왠일인지"], a:["웬일인지"], note:"'웬일'은 '어찌 된 일'. '왠'은 '왠지'에만 써."},
  {n:"46", p:"정답을 ____.", o:["맞히다","맞추다"], a:["맞히다"], note:"정답을 알아맞히는 건 '맞히다'."},
  {n:"47", p:"줄을 ____.", o:["맞히다","맞추다"], a:["맞추다"], note:"서로 나란히 하는 건 '맞추다'."},
  {n:"48", p:"화살을 과녁에 ____.", o:["맞히다","맞추다"], a:["맞히다"], note:"목표에 적중시키는 건 '맞히다'."},
  {n:"49", p:"예방접종을 ____.", o:["맞히다","맞추다"], a:["맞히다"], note:"주사를 놓아 맞게 하는 건 '맞히다'."},
  {n:"50", p:"그는 나를 ____ 쳐다봤다.", o:["지그시","지긋이"], a:["지그시"], note:"슬며시 누르거나 바라보는 건 '지그시'."},
  {n:"51", p:"연세가 ____ 든 분께서", o:["지그시","지긋이"], a:["지긋이"], note:"나이가 꽤 많은 건 '지긋이'."},
  {n:"52", p:"액자를 ____ 놓아두었다.", o:["받드시","반듯이"], a:["반듯이"], note:"비뚤지 않게 바르게는 '반듯이'."},
  {n:"53", p:"가방을 ____.", o:["매다","메다"], a:["메다"], note:"어깨에 걸치는 건 '메다'."},
  {n:"54", p:"신발끈을 ____.", o:["매다","메다"], a:["매다"], note:"끈을 묶는 건 '매다'."},
  {n:"55", p:"화를 ____.", o:["돋우다","돋구다"], a:["돋우다"], note:"'돋구다'는 안경 도수에만 써."},
  {n:"56", p:"밤을 ____.", o:["새우다","세우다"], a:["새우다"], note:"잠 안 자고 밤을 지내는 건 '새우다'."},
  {n:"57", p:"건물을 ____.", o:["새우다","세우다"], a:["세우다"], note:""},
  {n:"58", p:"나에겐 한 가지 ____이 있어.", o:["바람","바램"], a:["바람"], note:"'바라다'의 명사라 '바람'."},
  {n:"59", p:"시험에 꼭 합격하길 ____.", o:["바래","바라"], a:["바라"], note:"기본형이 '바라다'라서 '바라'."},
  {n:"60", p:"바른 표기를 고르세요.", o:["돌맹이","돌멩이"], a:["돌멩이"], note:"'돌멩이'가 표준어. 학습지엔 '돌맹이'로 잘못 표시돼 있었어."},
  {n:"61", p:"____가 떨어진다.", o:["정나미","정내미"], a:["정나미"], note:""},
  {n:"62", p:"바른 표기를 고르세요.", o:["째째하게","쩨쩨하게"], a:["쩨쩨하게"], note:""},

// 화면 요소 모으기
const startEl = document.getElementById("start");
const quizEl = document.getElementById("quiz");
const resultEl = document.getElementById("result");

let chosenCount = "all";
let chosenOrder = "random";
let current = [];     // 이번 판에 풀 문제들
let index = 0;        // 지금 몇 번째 문제인지
let score = 0;
let wrongList = [];   // 틀린 문제 모아두는 바구니

// 시작 화면 칩 고르기
function setupChips(groupId, setter) {
  const group = document.getElementById(groupId);
  group.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    group.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on");
    setter(chip.dataset.count || chip.dataset.order);
  });
}
setupChips("countChips", v => chosenCount = v);
setupChips("orderChips", v => chosenOrder = v);

// 바구니를 뒤섞는 함수 (피셔-예이츠)
function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startQuiz() {
  let pool = chosenOrder === "random" ? shuffle(QUESTIONS) : QUESTIONS.slice();
  if (chosenCount !== "all") {
    pool = pool.slice(0, Number(chosenCount));
  }
  current = pool;
  index = 0;
  score = 0;
  wrongList = [];
  startEl.classList.add("hidden");
  resultEl.classList.add("hidden");
  quizEl.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  const q = current[index];

  document.getElementById("counter").textContent = (index + 1) + " / " + current.length;
  document.getElementById("runningScore").textContent = "점수 " + score;
  document.getElementById("progressBar").style.width = ((index) / current.length * 100) + "%";
  document.getElementById("qnum").textContent = "원본 " + q.n + "번";

  // ____ 자리를 밑줄 빈칸으로 바꿔서 보여줌
  const promptEl = document.getElementById("prompt");
  promptEl.innerHTML = escapeHtml(q.p).replace("____", '<span class="blank"></span>');

  // 보기 버튼 만들기. 순서도 섞어줌
  const optionsEl = document.getElementById("options");
  optionsEl.innerHTML = "";
  const shownOptions = shuffle(q.o);
  shownOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.innerHTML = '<span>' + escapeHtml(opt) + '</span>';
    btn.addEventListener("click", () => pick(opt, q));
    optionsEl.appendChild(btn);
  });

  // 피드백 영역 숨기기
  document.getElementById("feedback").classList.add("hidden");
  document.getElementById("note").classList.add("hidden");
  document.getElementById("nextWrap").classList.add("hidden");
}

function pick(chosen, q) {
  const isRight = q.a.includes(chosen);
  if (isRight) score++;
  else wrongList.push({ q: q, mine: chosen });

  // 버튼 잠그고 정답/오답 색칠
  const buttons = document.querySelectorAll("#options .opt");
  buttons.forEach(btn => {
    const label = btn.querySelector("span").textContent;
    btn.disabled = true;
    if (q.a.includes(label)) {
      btn.classList.add("correct");
      btn.insertAdjacentHTML("beforeend", '<span class="mark">정답</span>');
    }
    if (label === chosen && !isRight) {
      btn.classList.add("wrong");
      btn.insertAdjacentHTML("beforeend", '<span class="mark">내 선택</span>');
    }
  });

  // 판정 문구
  const verdict = document.getElementById("verdict");
  verdict.textContent = isRight ? "정답" : "오답 - 정답은 " + q.a.join(", ");
  verdict.className = "verdict " + (isRight ? "ok" : "no");

  // 설명 있으면 보여주기
  const noteEl = document.getElementById("note");
  if (q.note) {
    noteEl.textContent = q.note;
    noteEl.classList.remove("hidden");
  }

  document.getElementById("feedback").classList.remove("hidden");
  document.getElementById("runningScore").textContent = "점수 " + score;

  const nextBtn = document.getElementById("nextBtn");
  nextBtn.textContent = (index + 1 === current.length) ? "결과 보기" : "다음";
  document.getElementById("nextWrap").classList.remove("hidden");
  nextBtn.focus();
}

function next() {
  index++;
  if (index >= current.length) showResult();
  else renderQuestion();
}

function showResult() {
  quizEl.classList.add("hidden");
  resultEl.classList.remove("hidden");

  const total = current.length;
  const pct = Math.round(score / total * 100);
  document.getElementById("finalScore").textContent = score + " / " + total;
  document.getElementById("finalPct").textContent = "정답률 " + pct + "%";

  const area = document.getElementById("reviewArea");
  area.innerHTML = "";
  if (wrongList.length === 0) {
    area.innerHTML = '<div class="allright">다 맞았어. 완벽해.</div>';
    return;
  }
  const title = document.createElement("div");
  title.className = "review-title";
  title.textContent = "틀린 문제 " + wrongList.length + "개 다시 보기";
  area.appendChild(title);

  wrongList.forEach(item => {
    const q = item.q;
    const div = document.createElement("div");
    div.className = "review-item";
    const sentence = escapeHtml(q.p).replace("____", "(&nbsp;&nbsp;&nbsp;&nbsp;)");
    let html = '<div class="rq">' + q.n + "번. " + sentence + "</div>";
    html += '<div class="ra mine">내 선택: ' + escapeHtml(item.mine) + "</div>";
    html += '<div class="ra ans">정답: ' + escapeHtml(q.a.join(", ")) + "</div>";
    if (q.note) html += '<div class="rnote">' + escapeHtml(q.note) + "</div>";
    div.innerHTML = html;
    area.appendChild(div);
  });
}

// < 같은 글자가 그대로 보이게 처리
function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("nextBtn").addEventListener("click", next);
document.getElementById("againBtn").addEventListener("click", startQuiz);
document.getElementById("homeBtn").addEventListener("click", () => {
  resultEl.classList.add("hidden");
  startEl.classList.remove("hidden");
});
</script>
</body>
</html>
